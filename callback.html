<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14111f;color:#f4f1fa;font:16px/1.5 system-ui,sans-serif;text-align:center}a{color:#ffd166}</style>

<body>
<main>
<h1>Signing you in…</h1>
<p id="msg">Taking you back to the dashboard.</p>
</main>
<script>
// Where the bot's dashboard lives. Change this if its address ever changes.
var TARGET = 'http://37.148.199.201:31107/callback';
var q = location.search;
if (/[?&]code=/.test(q) || /[?&]error=/.test(q)) {
  location.replace(TARGET + q);
} else {
  document.getElementById('msg').textContent = 'Nothing to forward. Start from the dashboard and press Log in with Yapper.';
}
</script>
</body>
